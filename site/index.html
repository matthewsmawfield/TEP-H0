    <meta name="dc.description" content="The Hubble Tension—the persistent $5\sigma$ discrepancy between local distance-ladder measurements ($H_0 \approx 73.0\ {\rm km\,s^{-1}\,Mpc^{-1}}$) and early-universe CMB inference ($H_0 = 67.4 \pm 0.5\ {\rm km\,s^{-1}\,Mpc^{-1}}$)—represents a significant challenge in precision cosmology. This paper demonstrates that the discrepancy is resolved by an environment-dependent Cepheid clock bias, as predicted by the Temporal Equivalence Principle (TEP). The resolving mechanism is environmental clock calibration: Cepheid variable stars function as environment-dependent &quot;standard clocks.&quot; Under TEP, proper time is a dynamical scalar field that couples universally to non-gravitational matter. Because stellar pulsation rates operate in local proper time, calibrating classical Cepheids in deep-potential SN Ia host galaxies against diffuse, low-mass anchor galaxies systematically misestimates host distance moduli. When interpreted through a universal Period--Luminosity relation, this clock-rate anomaly mimics diminished luminosity, leading to underestimated distances and an inflated local Hubble constant. In standard distance-ladder linear regression, unconstrained latent host distance moduli $\mu_i$ algebraically absorb host-level environmental shifts. A standard-ladder projection test that inserts a TEP environmental column into the SH0ES design matrix therefore yields an apparent null result. This structural degeneracy is resolved by formulating the calibrator-host distance ladder as a generative clock-aware model coupled to the Hubble flow. This generative framework is tested using the complete public Riess et al. (2022) sample of 37 distinct SN Ia host galaxies, utilizing a local inner-potential coordinate $\sigma_*$ compiled from published stellar-absorption dispersions (18 hosts) and calibrated H&nbsp;I linewidth dispersion proxies (19 hosts), matched to the anchor endpoint construction and combined with continuous environmental screening. The canonical peculiar-velocity convention throughout is the R22 baseline $\sigma_v = 250\ {\rm km/s}$; all other $\sigma_v$ values are reported as sensitivity variants. A median split at $\sigma_* = 95\ {\rm km/s}$ stratifies the derived per-host expansion rates by $\Delta H_0 = 9.59\ {\rm km\,s^{-1}\,Mpc^{-1}}$ (Spearman $\rho = 0.553$, $p = 3.9\times10^{-4}$; Pearson $r = 0.501$, $p = 0.0016$), strengthening to $r = 0.556$ ($p = 0.017$) on the stellar-absorption-only subset. Across all 37 hosts, the generative endpoint likelihood yields $\Gamma_X=(3.846\pm1.653)\times10^7\ {\rm km\,s^{-1}\,Mpc^{-1}}$ ($2.33\sigma$) under canonical $250\ {\rm km/s}$ velocity variance, strengthening to $(3.906\pm1.389)\times10^7$ ($2.81\sigma$) under the reduced-scatter sensitivity variants ($\sigma_v = 150$--$182.1\ {\rm km/s}$), with permutation $p = 0.033$, 99.8% positive bootstrap draws, and 100% leave-one-host-out sign stability (37 of 37 refits positive). In the cosmologically constrained host-level expansion-rate likelihood across the 33 Hubble-flow hosts, the combined endpoint response is recovered at $\Gamma_X=(3.805\pm1.647)\times10^7\ {\rm km\,s^{-1}\,Mpc^{-1}}$ ($2.31\sigma$; $3.47\sigma$ at $150\ {\rm km/s}$), yielding a conventional Hubble-flow intercept of $H_{\rm app}=68.48\pm1.47\ {\rm km\,s^{-1}\,Mpc^{-1}}$ at the canonical convention ($68.31\pm0.97$ at $\sigma_v = 150\ {\rm km/s}$). When evaluated in a joint multi-block framework with independent TRGB distances and geometric anchors, the multi-block likelihood favours an environmental response under the restricted Cepheid closure ($\kappa_{\rm Cep} = (0.665 \pm 0.362)\times 10^6\ {\rm mag}$, $1.83\sigma$ at canonical $\sigma_v = 250\ {\rm km/s}$; $(0.746 \pm 0.343)\times 10^6\ {\rm mag}$, $2.17\sigma$ at $\sigma_v = 150\ {\rm km/s}$), resolving the local Hubble constant to $H_{\rm app} = 68.82\pm 1.45\ {\rm km\,s^{-1}\,Mpc^{-1}}$, while the standalone redshift-only regression in $H_0$ space yields $\kappa_{\rm Cep} = (1.206 \pm 0.528)\times 10^6\ {\rm mag}$ ($2.29\sigma$ canonical; $(1.275 \pm 0.370)\times 10^6\ {\rm mag}$, $3.44\sigma$ at $\sigma_v = 150\ {\rm km/s}$). Under the physical coupled observing-chain model, the spectroscopic tracer's direct gravitational redshift contributes a velocity slope $\beta_{X,\rm grav} = c/\langle d \rangle \sim 10^4\ {\rm km\,s^{-1}\,Mpc^{-1}}$ (<0.1% of the combined slope), so that >99.9% of the response is carried by the Cepheid distance scale ($\kappa_{\rm Cep}^{\rm equiv} = (1.220 \pm 0.531)\times 10^6\ {\rm mag}$); this allocation is physically derived from proper-time dilation, with host-specific aperture validation supplied by a full-provenance NED tracer census (Step 54; Appendix C.5). Model comparison favours the environmental response: at the canonical convention the velocity-carrier configuration attains the lowest information criteria of the multi-block family ($\Delta{\rm BIC} = -1.36$ relative to the null), a leave-one-out cross-validation tournament over fixed and scanned response shapes selects the bounded amplitude-sector form $S_A = \min[1,(\sigma_*/\sigma_T)^{2/3}]$ in every primary dataset, and a Stouffer combination of the four primary channels with independent noise sources returns $Z = +4.14$ ($p = 3.4\times10^{-5}$ two-sided; $Z = +3.08$ under a conservative shared correlation $\rho = 0.3$). Propagating the TEP potential correction through the distance ladder requires an explicit estimator distinction. The prespecified primary full-ladder projection propagates the measured endpoint-equivalent response and yields $H_0=70.463\pm0.972\ {\rm km\,s^{-1}\,Mpc^{-1}}$, reducing the offset from Planck $67.4 \pm 0.5$ to $2.80\sigma$ with a likelihood improvement of $\Delta\chi^2=+9.870$; conditional matrix projections give $71.01\ {\rm km\,s^{-1}\,Mpc^{-1}}$ under canonical scaling. When the response coefficient is instead left free inside the ladder design matrix it returns $\kappa_{\rm Cep}=(0.056\pm0.370)\times10^6\ {\rm mag}$ — the expected near-null: the shared Cepheid zero point absorbs the anchor-to-host common mode, so the matrix channel measures only the differential component and cannot see the term that closes the remaining offset. A separate unified host-level reconstruction, which re-optimizes the environmental response to flatten the host-environment trend, yields $H_0=67.83\pm1.56\ {\rm km\,s^{-1}\,Mpc^{-1}}$, internally consistent with the TEP CMB value ($66.70 \pm 0.58$, Paper 26) at $0.68\sigma$ — an agreement between two products of the same framework, not an independent cross-check — and $0.26\sigma$ from Planck. The latter is a host-level reconciliation route, not the primary full-ladder estimator: it evaluates the fitted response at the cosmic baseline and is conditional on that response form extending below the anchor ensemble to the unperturbed potential. Full-matrix propagation through the 3,490-row SH0ES system confirms exact reference-gauge invariance. The statistically cleanest channel is the within-host period structure: the environment-coupled Cepheid period term, identified through the 41 independent period distributions (37 hosts plus 4 anchors) and immune to latent-modulus absorption and peculiar-velocity systematics by construction, returns $\kappa_P = (-4.20 \pm 3.38)\times 10^5\ {\rm mag}$ for the ad hoc linear carrier, resolving to $2.3$--$2.8\sigma$ under the period-quadratic carrier derived from the amplitude-sector response law, with a negative sign in all 41 leave-one-host-out refits and a fitted per-host slope ordering of $+1.12 \pm 0.30 \times 10^6$ mag per unit $X$. Finally, single-galaxy differential tests provide internal signatures with the sign predicted by TEP free from host-to-host peculiar velocity systematics: M31 inner versus outer Cepheids exhibit an empirical Period--Luminosity offset of $+0.356 \pm 0.136\ {\rm mag}$ ($2.6\sigma$), increasing to $+0.681 \pm 0.187\ {\rm mag}$ ($3.65\sigma$) under spatial PHAT matching; however, M31 fails pair-matched controls (colour-matched $-0.017 \pm 0.128$ mag, $0.1\sigma$; eW-matched $-0.103 \pm 0.129$ mag, $0.8\sigma$), and the two admissible readings are tested against the theory's ambient closure. The overmatching hypothesis — that error matching discards an ambient-field signal — is bounded out: the photometric error is nearly orthogonal to the kpc-scale ambient-field proxy (${\rm corr}=-0.18$), and matching on the ambient field alone leaves a positive but inconclusive offset ($+0.206 \pm 0.163$ mag) that does not survive joint environment-plus-error control ($-0.069 \pm 0.126$ mag under matched (logP, $e_W$, $\log u_{\rm amb}$) cells — the residual was error-carried within ambient strata). Stratified through the full error distribution the conditional contrast declines monotonically from $+0.270 \pm 0.304$ mag at the 10th-percentile error level to $-0.117 \pm 0.202$ mag in the poorest, and the HST PHAT channel shows the same susceptibility under propagated-error matching ($-0.565 \pm 0.079$ mag, against $+0.906 \pm 0.147$ mag under neighbour-density control). The M31 channel is therefore carried as conditional evidence: the raw gradient is real and a positive residual is permitted in the best-measured strata, but neither reading closes the case. The LMC gradient ($+0.0284 \pm 0.0086$ mag, $3.3\sigma$) is robust to period and colour matching and remains the strongest single-galaxy result. <em>Keywords:</em> Hubble tension -- Cepheid variables -- distance ladder -- stellar velocity dispersion -- peculiar velocities -- temporal equivalence principle">

    <script>
        // Component loading system
        async function loadManuscriptComponents() {
            try {
                // Load manifest
                const manifest = await fetch('manifest.json').then(r => r.json());
                
                // Get container elements
                const loadingDiv = document.getElementById('loading');
                const contentDiv = document.getElementById('manuscript-content');
                
                // Load each section in order
                for (const section of manifest.sections.sort((a, b) => a.order - b.order)) {
                    try {
                        const html = await fetch(`components/${section.file}`).then(r => r.text());
                        
                        // Create section container
                        const sectionDiv = document.createElement('div');
                        sectionDiv.id = section.id;
                        sectionDiv.className = 'manuscript-section';
                        sectionDiv.setAttribute('data-section', section.title);
                        sectionDiv.innerHTML = html;
                        
                        // Append to content container
                        contentDiv.appendChild(sectionDiv);
                        
                        console.log(`Loaded section: ${section.title}`);
                    } catch (error) {
                        console.error(`Failed to load section ${section.title}:`, error);
                        
                        // Create error placeholder
                        const errorDiv = document.createElement('div');
                        errorDiv.innerHTML = `<div style="background-color: #ffe6e6; border: 1px solid #ff9999; padding: 15px; margin: 20px 0; border-radius: 5px;">
                            <h3 style="color: #cc0000; margin-top: 0;">Error Loading Section: ${section.title}</h3>
                            <p>Failed to load <code>components/${section.file}</code></p>
                            <p style="font-size: 12px; color: #666;">Check console for details</p>
                        </div>`;
                        contentDiv.appendChild(errorDiv);
                    }
                }
                
                // Hide loading, show content
                loadingDiv.style.display = 'none';
                contentDiv.style.display = 'block';
                
                // Re-initialize features that depend on content being loaded
                initializePageFeatures();
                
                console.log('Manuscript loading complete');
                
            } catch (error) {
                console.error('Failed to load manuscript:', error);
                document.getElementById('loading').innerHTML = `
                    <div style="background-color: #ffe6e6; border: 1px solid #ff9999; padding: 20px; border-radius: 5px;">
                        <h3 style="color: #cc0000; margin-top: 0;">Error Loading Manuscript</h3>
                        <p>Failed to load the manuscript components. Please check your network connection and try again.</p>
                        <p style="font-size: 12px; color: #666;">Error: ${error.message}</p>
                        <button onclick="location.reload()" style="background: #4A90C2; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer;">Retry</button>
                    </div>
                `;
            }
        }
        
        // Initialize page features after content is loaded
        function initializePageFeatures() {
            // Re-render MathJax if present
            if (window.MathJax && window.MathJax.typesetPromise) {
                window.MathJax.typesetPromise().catch(err => console.warn('MathJax rendering error:', err));
            }
        }
        
        // Copy to clipboard function (for code examples)
        function copyToClipboard(text, button) {
            navigator.clipboard.writeText(text).then(() => {
                button.style.color = '#1a365d';
                button.style.opacity = '1';
                button.style.transform = 'scale(1.1)';
                setTimeout(() => {
                    button.style.color = '#495773';
                    button.style.opacity = '0.7';
                    button.style.transform = 'scale(1)';
                }, 800);
            });
        }
        
        // Load components when page is ready
        document.addEventListener('DOMContentLoaded', loadManuscriptComponents);
        
        // Change title for PDF filename when printing
        const originalTitle = document.title;
        const pdfTitle = '11-TEP-H0-v0.11-KingstonUponHull';
        window.addEventListener('beforeprint', () => { document.title = pdfTitle; });
        window.addEventListener('afterprint', () => { document.title = originalTitle; });
    </script>
